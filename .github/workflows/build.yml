name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TapyNote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TapyNote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TapyNote (latest build)
          prerelease: false
          make_latest: true
          body: Tap TapyNote.apk below to download and install.
          files: app/build/outputs/apk/debug/TapyNote.apk
